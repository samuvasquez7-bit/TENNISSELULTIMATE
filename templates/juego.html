<script>

const $=s=>document.querySelector(s),cv=$('#game'),ctx=cv.getContext('2d',{alpha:false}),courtEl=$('#court'),W=960,H=560,NET=280;

const key={left:false,right:false,up:false,down:false,p2left:false,p2right:false,p2up:false,p2down:false},player={x:480,y:445,swing:0,pose:'idle',color:'#56cdfc'},bot={x:480,y:112,swing:0,pose:'idle',color:'#ff6d61'},mateYou={x:310,y:455,swing:0,pose:'idle',color:'#34aede'},mateBot={x:650,y:100,swing:0,pose:'idle',color:'#fa8a65'},ball={x:480,y:410,vx:0,vy:0,spin:0,last:'you',live:false,bounced:false,trail:[]};let particles=[],queuedShot='',shotWindow=0,lastTime=0,gamepadPrev=0,audioCtx=null;
function save(){try{localStorage.setItem('tennis-arena',JSON.stringify(cfg))}catch{}court=surfaces[cfg.stage];score()}
const jugadorConSesion={{ 'true' if session.get('user_id') else 'false' }};
const nuevoIdPartida=()=>window.crypto?.randomUUID?.()||('partida-'+Date.now()+'-'+Math.random().toString(36).slice(2));
let partidaId=nuevoIdPartida(), victoriaReportada=false;
function sound(freq=420,duration=.06){if(!cfg.sfx)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=freq;osc.connect(gain).connect(audioCtx.destination);gain.gain.setValueAtTime(.045,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.start();osc.stop(audioCtx.currentTime+duration)}catch{}}
function buzz(ms=9){if(cfg.vibration&&navigator.vibrate)navigator.vibrate(ms)}
function menu(page='menu'){view=page;const o=$('#overlay');o.style.display='grid';let html='';if(page==='menu')html='<div class="panel"><div class="eyebrow">BIENVENIDO A LA PISTA</div><h1>Tennis Arena</h1><p>Compite en un partido rápido, entrena tus golpes y ajusta la dificultad a tu nivel.</p><div class="grid"><button class="primary" data-go="play">▶ Jugar<span>Comienza un partido</span></button><button data-go="mode">🎾 Modo de juego<span>'+({solo:'1 vs IA',local:'1 vs 1 local',doubles:'Dobles vs IA',doubles_local:'Dobles local',training:'Entrenamiento'}[mode]||'1 vs IA')+'</span></button><button data-go="settings">⚙ Ajustes<span>Sonido, superficie y nivel</span></button><button data-go="controls">⌨ Controles<span>Teclado, táctil y gamepad</span></button><button data-go="restart">↻ Reiniciar<span>Nuevo partido</span></button><button data-go="exit">⌂ Menú<span>Volver al inicio</span></button></div></div>';
if(page==='mode')html='<div class="panel"><div class="eyebrow">MODOS DE JUEGO</div><h2>Elige tu partido</h2><div class="grid"><button class="'+(mode==='solo'?'selected':'')+'" data-mode="solo">1 vs IA<span>Individual local</span></button><button class="'+(mode==='local'?'selected':'')+'" data-mode="local">1 vs 1 local<span>Dos jugadores, mismo teclado</span></button><button class="'+(mode==='doubles'?'selected':'')+'" data-mode="doubles">2 vs 2 IA<span>Dobles contra el equipo rival</span></button><button class="'+(mode==='doubles_local'?'selected':'')+'" data-mode="doubles_local">Dobles local<span>Dos jugadores + compañeros IA</span></button><button class="'+(mode==='training'?'selected':'')+'" data-mode="training">Entrenamiento<span>Practica sin marcador</span></button><button data-go="online">Multijugador online<span>Estado de conexión</span></button></div><button data-go="menu">Volver</button></div>';
if(page==='controls')html=controlsPanel();
if(page==='online')html='<div class="panel"><div class="eyebrow">MULTIJUGADOR ONLINE</div><h2>Conexión no configurada</h2><p>Las partidas rápidas, las salas privadas y el matchmaking necesitan un servidor de señalización y sincronización. Esta página no tiene una conexión de juego configurada, así que todavía no puede crear partidas online.</p><p>Los modos locales ya están disponibles. Al conectar un backend, aquí se podrán añadir salas con código y búsqueda de rival con medición de latencia.</p><button class="primary" data-go="mode">Elegir modo local</button><button class="wide" data-go="menu">Volver</button></div>';
if(page==='settings')html='<div class="panel"><div class="eyebrow">CONFIGURACIÓN</div><h2>Ajustes</h2>'+toggle('sfx','Efectos de sonido','Golpes y rebotes')+toggle('vibration','Vibración','Respuesta háptica en móviles')+'<div class="setting"><div><b>Dificultad</b><small>Velocidad y lectura de la IA</small></div><div class="choices">'+['facil','media','dificil'].map(v=>'<button data-diff="'+v+'" class="'+(cfg.difficulty===v?'selected':'')+'">'+v+'</button>').join('')+'</div></div><div class="setting"><div><b>Superficie</b><small>Velocidad de la pelota</small></div><div class="choices">'+Object.keys(surfaces).map(v=>'<button data-stage="'+v+'" class="'+(cfg.stage===v?'selected':'')+'">'+v.replace('_',' ')+'</button>').join('')+'</div></div><button data-go="menu">Volver</button></div>';
if(page==='pause')html='<div class="panel"><div class="eyebrow">PARTIDO EN PAUSA</div><h2>¿Tomamos aire?</h2><button class="primary wide" data-go="resume">Continuar</button><button class="wide" data-go="restart">Reiniciar partido</button><button class="wide" data-go="settings">Ajustes</button><button class="wide" data-go="menu">Menú principal</button></div>';
if(page==='result')html='<div class="panel"><div class="eyebrow">PARTIDO TERMINADO</div><h1>'+ (sets[0]>sets[1]?'¡Victoria!':'Buen intento')+'</h1><p>Resultado final: '+sets[0]+' – '+sets[1]+' sets.</p><button class="primary wide" data-go="restart">Jugar otra vez</button><button class="wide" data-go="menu">Menú principal</button></div>';
o.innerHTML=html;o.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));o.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;menu('mode')});o.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{cfg[b.dataset.toggle]=!cfg[b.dataset.toggle];save();menu('settings')});o.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{cfg.difficulty=b.dataset.diff;save();menu('settings')});o.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{cfg.stage=b.dataset.stage;save();menu('settings')});o.querySelectorAll('[data-bind]').forEach(b=>b.onclick=()=>{rebinding=b.dataset.bind.split('.');b.classList.add('waiting');b.textContent='Pulsa tecla…'});const resetBind=o.querySelector('[data-reset-bind]');if(resetBind)resetBind.onclick=()=>{cfg.bindings=JSON.parse(JSON.stringify(defaultBindings));save();menu('controls')}}
function toggle(k,label,desc){return '<div class="setting"><div><b>'+label+'</b><small>'+desc+'</small></div><button data-toggle="'+k+'">'+(cfg[k]?'Activado':'Apagado')+'</button></div>'}
function keyLabel(code){return ({Space:'Espacio',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Numpad0:'Num 0',Numpad1:'Num 1',Numpad2:'Num 2',Numpad3:'Num 3'})[code]||code.replace(/^Key/,'')}
function controlsPanel(){const names={up:'Arriba',left:'Izquierda',down:'Abajo',right:'Derecha',forehand:'Derecha / sacar',backhand:'Revés',volley:'Volea',power:'Potente'},rows=Object.entries(names);let bindings='';for(const who of ['p1','p2'])for(const [action,label] of rows)bindings+='<div class="bind-row"><span>'+ (who==='p1'?'Jugador 1 · ':'Jugador 2 · ')+label+'</span><button data-bind="'+who+'.'+action+'">'+keyLabel(cfg.bindings[who][action])+'</button></div>';return '<div class="panel"><div class="eyebrow">CONTROLES</div><h2>Controles locales</h2><p>Jugador 1 usa WASD y teclas cercanas a la mano izquierda. Jugador 2 usa flechas y teclado numérico. Para remapear, pulsa una tecla de la lista y luego la nueva tecla.</p><div class="bind-list">'+bindings+'</div><p><b>Táctil:</b> desliza para moverte y usa cruceta/botones. <b>Gamepad:</b> stick o cruceta; A golpea, X/Y/B seleccionan variantes.</p><button data-reset-bind>Restablecer teclas</button><button class="wide" data-go="menu">Volver</button></div>'}
function go(dest){sound(560,.04);if(dest==='play'||dest==='resume'){if(dest==='play')newMatch();$('#overlay').style.display='none';playing=true;paused=false;view='play';return}if(dest==='restart'){newMatch();$('#overlay').style.display='none';playing=true;paused=false;view='play';return}if(dest==='exit'){newMatch();playing=false;menu();return}menu(dest)}
function newMatch(){sets=[0,0];games=[0,0];points=[0,0];server='you';reset();score()}
function registrarVictoriaPartida(){if(!jugadorConSesion||victoriaReportada||mode==='training')return;victoriaReportada=true;fetch("{{ url_for('api_registrar_victoria_juego') }}",{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({partida_id:partidaId,modo:mode})}).then(response=>response.json()).then(data=>{if(!data.ok||!data.giro_desbloqueado)return;const panel=$('#overlay').querySelector('.panel');if(!panel)return;const notice=document.createElement('p');notice.textContent='¡Victoria! Desbloqueaste un descuento. Reclámalo en Juegos.';const link=document.createElement('a');link.href="{{ url_for('juegos') }}";link.className='reward-unlocked-link';link.textContent='Reclamar descuento';panel.append(notice,link)}).catch(()=>{})}
function reset(){ball.live=false;ball.vx=ball.vy=ball.spin=0;ball.bounced=false;ball.trail.length=0;player.x=480;player.y=445;bot.x=480;bot.y=112;mateYou.x=310;mateYou.y=455;mateBot.x=650;mateBot.y=100;serveWait=0;ball.x=server==='you'?player.x:bot.x;ball.y=server==='you'?player.y-32:bot.y+32;$('#hint').textContent=server==='you'?'ESPACIO para sacar':'El rival prepara el saque'}
function score(){const label=(a,b)=>a>=3&&b>=3?(a===b?'40':a>b?'A':'40'):['0','15','30','40'][a];$('#sets').textContent=sets.join('–');$('#games').textContent=games.join('–');$('#points').textContent=label(points[0],points[1])+'–'+label(points[1],points[0]);$('#serve').style.color=server==='you'?'#dcff42':'#638087';$('#rival').textContent=mode==='local'||mode==='doubles_local'?'JUGADOR 2':mode==='doubles'?'EQUIPO RIVAL':'RIVAL IA';$('#playerLabel').firstChild.textContent=mode==='local'||mode==='doubles_local'?'JUGADOR 1 ':'TÚ ';$('#difficulty').textContent=mode==='training'?'Entrenamiento':mode==='local'||mode==='doubles_local'?'Partido local':'Dificultad '+cfg.difficulty;$('#stage').textContent=court.name}
function serve(w=server){if(ball.live)return;ball.live=true;ball.bounced=false;ball.last=w;ball.x=w==='you'?player.x:bot.x;ball.y=w==='you'?player.y-32:bot.y+32;const side=w==='you'?-1:1;ball.vx=(Math.random()-.5)*105;ball.vy=side*345*court.speed;animate(w,'serve');$('#hint').textContent='EN JUEGO'}
function animate(w,type){const q=w==='you'?player:bot;q.swing=.3;q.pose=type;for(let i=0;i<9;i++)particles.push({x:ball.x,y:ball.y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,life:.34,color:type==='power'?'#ffb000':'#eaff50'});sound(type==='power'?185:420,.07);buzz(type==='power'?20:7)}
function hit(w,type='forehand',actor=null){if(!ball.live){if(server===w)serve(w);return}const q=actor||(w==='you'?player:bot),approaching=w==='you'?ball.vy>0:ball.vy<0,reach=type==='volley'?105:88;if(approaching&&Math.hypot(ball.x-q.x,ball.y-q.y)<reach){const power=type==='power',speed=(power?590:type==='volley'?465:425)*court.speed,offset=Math.max(-.78,Math.min(.78,(ball.x-q.x)/105));ball.vx=offset*speed+(Math.random()-.5)*18;ball.vy=(w==='you'?-1:1)*Math.sqrt(speed*speed-ball.vx*ball.vx);ball.spin=type==='backhand'?-24:type==='volley'?7:20;ball.last=w;ball.bounced=false;queuedShot='';shotWindow=0;animate(w,type)}}
function queueShot(kind){queuedShot=kind;shotWindow=.46;hit('you',kind)}function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),750)}
function award(w,why){if(!ball.live)return;ball.live=false;if(mode==='training'){toast('¡BUEN GOLPE!');setTimeout(()=>{if(view==='play')reset()},700);return}const n=w==='you'?0:1;points[n]++;toast(w==='you'?'¡PUNTO!':why||'PUNTO DEL RIVAL');sound(w==='you'?680:170,.12);if(points[n]>=4&&points[n]-points[1-n]>=2){games[n]++;points=[0,0];server=server==='you'?'ai':'you';if(games[n]>=6&&games[n]-games[1-n]>=2){sets[n]++;games=[0,0];if(sets[n]===2){playing=false;score();if(sets[0]>sets[1])registrarVictoriaPartida();menu('result');return}}}score();setTimeout(()=>{if(view==='play')reset()},850)}
function moveAI(q,target,dt,speed){q.x+=Math.max(-speed*dt,Math.min(speed*dt,(target-q.x)*.8));q.x=Math.max(130,Math.min(830,q.x))}
function ai(dt){if(!ball.live){if(server==='ai'&&(serveWait+=dt)>.9)serve('ai');return}const params={facil:[.62,175,.22],media:[.79,245,.11],dificil:[.93,315,.045]}[cfg.difficulty],double=mode==='doubles'||mode==='doubles_local';if(mode==='local'||mode==='doubles_local'){const dx=(key.p2right?1:0)-(key.p2left?1:0),dy=(key.p2down?1:0)-(key.p2up?1:0),n=Math.hypot(dx,dy)||1;bot.x=Math.max(130,Math.min(830,bot.x+dx/n*310*dt));bot.y=Math.max(55,Math.min(260,bot.y+dy/n*310*dt))}else{const target=ball.vy<0?ball.x:480;moveAI(bot,target,dt,params[1]);if(ball.vy<0&&Math.hypot(ball.x-bot.x,ball.y-bot.y)<70&&Math.random()>params[2])hit('ai',Math.random()<.08?'power':'forehand')}
if(double){const targetB=ball.vy<0?ball.x+130:620;moveAI(mateBot,Math.max(150,Math.min(810,targetB)),dt,params[1]*.83);if(ball.vy<0&&Math.hypot(ball.x-mateBot.x,ball.y-mateBot.y)<68&&Math.hypot(ball.x-mateBot.x,ball.y-mateBot.y)<Math.hypot(ball.x-bot.x,ball.y-bot.y))hit('ai','forehand',mateBot);const targetY=ball.vy>0?ball.x-130:340;moveAI(mateYou,Math.max(150,Math.min(810,targetY)),dt,190);if(ball.vy>0&&Math.hypot(ball.x-mateYou.x,ball.y-mateYou.y)<64&&Math.hypot(ball.x-mateYou.x,ball.y-mateYou.y)<Math.hypot(ball.x-player.x,ball.y-player.y))hit('you','forehand',mateYou)}}
function update(dt){if(!playing||paused)return;const dx=(key.right?1:0)-(key.left?1:0),dy=(key.down?1:0)-(key.up?1:0);if(dx||dy){const n=Math.hypot(dx,dy);player.x+=dx/n*320*dt;player.y+=dy/n*320*dt;player.pose='run'}else player.pose='idle';player.x=Math.max(130,Math.min(830,player.x));player.y=Math.max(300,Math.min(505,player.y));if(shotWindow>0){shotWindow-=dt;hit('you',queuedShot)}ai(dt);for(const q of [player,bot,mateYou,mateBot])q.swing=Math.max(0,q.swing-dt);particles=particles.filter(q=>(q.life-=dt)>0);particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=100*dt});if(!ball.live)return;ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>9)ball.trail.shift();ball.vx+=ball.spin*dt;ball.spin*=Math.max(0,1-dt*.38);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.x<78||ball.x>882||ball.y<38||ball.y>522){award(ball.last==='you'?'ai':'you','¡FUERA!');return}}
function courtDraw(){ctx.fillStyle=court.o;ctx.fillRect(0,0,W,H);const grad=ctx.createLinearGradient(0,40,0,520);grad.addColorStop(0,court.a);grad.addColorStop(1,court.b);ctx.fillStyle=grad;ctx.fillRect(112,42,736,476);ctx.strokeStyle='#eaffef';ctx.lineWidth=4;ctx.strokeRect(112,42,736,476);ctx.beginPath();ctx.moveTo(202,42);ctx.lineTo(202,518);ctx.moveTo(758,42);ctx.lineTo(758,518);ctx.moveTo(112,184);ctx.lineTo(848,184);ctx.moveTo(112,376);ctx.lineTo(848,376);ctx.moveTo(480,42);ctx.lineTo(480,184);ctx.moveTo(480,376);ctx.lineTo(480,518);ctx.stroke();ctx.fillStyle='#142a2c';ctx.fillRect(80,NET-5,800,10);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(78,NET);ctx.lineTo(882,NET);ctx.stroke()}
function person(q,top){ctx.save();ctx.translate(q.x,q.y);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,28,25,7,0,0,Math.PI*2);ctx.fill();if(q.pose==='run')ctx.rotate(Math.sin(performance.now()/65)*.08);ctx.fillStyle='#efb98d';ctx.beginPath();ctx.arc(0,-24,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=q.color;ctx.beginPath();ctx.roundRect(-17,-11,34,40,9);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-8,29);ctx.lineTo(-13,39);ctx.moveTo(8,29);ctx.lineTo(13,39);ctx.stroke();ctx.save();ctx.translate(22,-2);ctx.rotate((top?-1:1)*(q.swing?Math.sin(q.swing*20)*1.2:.25));ctx.strokeStyle='#f6eed0';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-12,12,15,.2,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,2);ctx.lineTo(0,15);ctx.stroke();ctx.restore();ctx.restore()}
function draw(){courtDraw();for(const q of particles){ctx.globalAlpha=Math.min(1,q.life*3);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const doubles=mode==='doubles'||mode==='doubles_local';if(doubles){person(mateBot,true);person(mateYou,false)}person(bot,true);person(player,false);ball.trail.forEach((q,i)=>{ctx.fillStyle='rgba(225,255,65,'+(i/25)+')';ctx.beginPath();ctx.arc(q.x,q.y,Math.max(1,7*i/10),0,Math.PI*2);ctx.fill()});ctx.fillStyle='#e5ff43';ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,Math.PI*2);ctx.fill()}
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
function gamepad(){const pads=navigator.getGamepads?.()||[];for(const pad of pads){if(!pad)continue;const ax=pad.axes[0]||0,ay=pad.axes[1]||0;key.left=ax<-.28||pad.buttons[14]?.pressed;key.right=ax>.28||pad.buttons[15]?.pressed;key.up=ay<-.28||pad.buttons[12]?.pressed;key.down=ay>.28||pad.buttons[13]?.pressed;let pressed=pad.buttons[0]?.pressed?1:pad.buttons[2]?.pressed?2:pad.buttons[3]?.pressed?3:pad.buttons[1]?.pressed?4:0;if(pressed&&!gamepadPrev){queueShot(({1:'forehand',2:'backhand',3:'volley',4:'power'})[pressed])}gamepadPrev=pressed;break}}
function loop(t){const dt=Math.min(.033,Math.max(0,(t-lastTime)/1000));lastTime=t;gamepad();update(dt);draw();requestAnimationFrame(loop)}
function setKey(name,value){key[name]=value}function localKeyMap(){const map={};for(const who of ['p1','p2'])for(const dir of ['up','left','down','right'])map[cfg.bindings[who][dir]]=who==='p1'?dir:'p2'+dir;return map}function assignedShot(code,who){return ['forehand','backhand','volley','power'].find(a=>cfg.bindings[who][a]===code)}document.addEventListener('keydown',e=>{if(rebinding){if(e.code==='Escape'){rebinding=null;menu('controls');return}if(e.code.startsWith('Shift')||e.code.startsWith('Control')||e.code.startsWith('Alt'))return;const [who,action]=rebinding,old=cfg.bindings[who][action];for(const group of ['p1','p2'])for(const name of Object.keys(cfg.bindings[group]))if(cfg.bindings[group][name]===e.code)cfg.bindings[group][name]=old;cfg.bindings[who][action]=e.code;rebinding=null;save();menu('controls');e.preventDefault();return}const local=mode==='local'||mode==='doubles_local',map=local?localKeyMap():{ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};if(map[e.code]){e.preventDefault();setKey(map[e.code],true)}if(e.repeat)return;if(e.code==='Escape'&&view==='play'){paused=true;menu('pause')}if(view!=='play')return;const p1shot=assignedShot(e.code,'p1')||({KeyZ:'forehand',KeyX:'backhand',KeyC:'volley',KeyV:'power',Space:'forehand'})[e.code];if(p1shot){e.preventDefault();queueShot(p1shot)}if(local){const p2shot=assignedShot(e.code,'p2');if(p2shot){e.preventDefault();hit('ai',p2shot)}}});document.addEventListener('keyup',e=>{const local=mode==='local'||mode==='doubles_local',map=local?localKeyMap():{ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};if(map[e.code])setKey(map[e.code],false)});window.addEventListener('blur',()=>Object.keys(key).forEach(k=>key[k]=false));
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);setKey(k,true)});['pointerup','pointercancel','lostpointercapture'].forEach(type=>el.addEventListener(type,()=>setKey(k,false)))});document.querySelectorAll('[data-shot]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();queueShot(el.dataset.shot)}));
let swipe=null;function courtPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}cv.addEventListener('pointerdown',e=>{if(view!=='play'||e.target.closest('button'))return;cv.setPointerCapture?.(e.pointerId);const pt=courtPos(e);swipe={id:e.pointerId,x:pt.x,y:pt.y};if(pt.y>NET){player.x=Math.max(130,Math.min(830,pt.x));player.y=Math.max(300,Math.min(505,pt.y))}});cv.addEventListener('pointermove',e=>{if(!swipe||e.pointerId!==swipe.id)return;const pt=courtPos(e);if(pt.y>NET){player.x=Math.max(130,Math.min(830,pt.x));player.y=Math.max(300,Math.min(505,pt.y))}});cv.addEventListener('pointerup',e=>{if(!swipe||e.pointerId!==swipe.id)return;const pt=courtPos(e),dx=pt.x-swipe.x,dy=pt.y-swipe.y;swipe=null;if(Math.hypot(dx,dy)<20)queueShot('forehand');else if(Math.abs(dx)>55)queueShot(dx<0?'backhand':'forehand')});cv.addEventListener('pointercancel',()=>swipe=null);
$('#pause').onclick=()=>{if(view==='play'){paused=true;menu('pause')}};$('#sound').onclick=()=>{cfg.sfx=!cfg.sfx;save();$('#sound').textContent=cfg.sfx?'🔊':'🔇';$('#sound').setAttribute('aria-label',cfg.sfx?'Desactivar sonido':'Activar sonido')};$('#sound').textContent=cfg.sfx?'🔊':'🔇';$('#sound').setAttribute('aria-label',cfg.sfx?'Desactivar sonido':'Activar sonido');window.addEventListener('resize',resize,{passive:true});if('ResizeObserver'in window)new ResizeObserver(resize).observe(courtEl);resize();score();menu();requestAnimationFrame(loop);
